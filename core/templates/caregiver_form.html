<h1>{% if caregiver %}Edit{% else %}Create{% endif %} Caregiver</h1>
{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li
                {% if message.tags %} class="{{ message.tags }}"{% endif %}
            >
                {{ message }}
            </li>
        {% endfor %}
    </ul>
{% endif %}

<form method="post" enctype="multipart/form-data">{% csrf_token %}
    <label>User:</label>
    <select name="user_id" {% if caregiver %}disabled{% endif %} required>
        {% for user in users %}
        <option value="{{ user.user_id }}" {% if caregiver and caregiver.caregiver_user_id == user.user_id %}selected{% endif %}>
            {{ user.given_name }} {{ user.surname }}
        </option>
        {% endfor %}
    </select><br>
    <label>Photo:</label>
    <input type="file" name="photo" accept="image/*">{% if caregiver.photo %} (current: {{ caregiver.photo }}){% endif %}<br>
    <label>Gender:</label>
    <input type="text" name="gender" value="{{ caregiver.gender|default_if_none:'' }}"><br>
    <label>Caregiving Type:</label>
    <select name="caregiving_type" required>
        {% for value,label in care_types %}
            <option value="{{ value }}" {% if caregiver.caregiving_type == value %}selected{% endif %}>
                {{ label }}
            </option>
        {% endfor %}
    </select><br>
    <label>Hourly Rate:</label>
    <input type="number" step="0.01" name="hourly_rate" value="{{ caregiver.hourly_rate|default_if_none:'' }}"><br>
    <button type="submit">Save</button>
</form>
<a href="{% url 'caregiver_list' %}">Back to list</a>
