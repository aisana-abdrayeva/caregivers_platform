<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #4a6cf7;
            color: white;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn:hover {
            background: #3d59d6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dashboard</h1>

    <!-- USERS -->
    <a href="/users/" class="btn">Users</a>

    <!-- CAREGIVERS -->
    <a href="/caregivers/" class="btn">Caregivers</a>

    <!-- MEMBERS -->
    <a href="/members/" class="btn">Members</a>

    <!-- APPLICATIONS -->
    <a href="/applications/" class="btn">Applications</a>

    <!-- APPOINTMENTS -->
    <a href="/appointments/" class="btn">Appointments</a>

    <!-- JOBS -->
    <a href="/jobs/" class="btn">Jobs</a>

</div>

</body>
</html>
