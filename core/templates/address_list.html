<h1>Addresses</h1>
<a href="{% url 'address_create' %}">Create Address</a>
<table border="1">
    <tr>
        <th>Member</th>
        <th>House Number</th>
        <th>Street</th>
        <th>Town</th>
        <th>Actions</th>
    </tr>
    {% for address in addresses %}
    <tr>
        <td>{{ address.member.member_user.given_name }} {{ address.member.member_user.surname }}</td>
        <td>{{ address.house_number }}</td>
        <td>{{ address.street }}</td>
        <td>{{ address.town }}</td>
        <td>
            <a href="{% url 'address_edit' address.pk %}">Edit</a> |
            <form action="{% url 'address_delete' address.pk %}" method="post" style="display:inline">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
