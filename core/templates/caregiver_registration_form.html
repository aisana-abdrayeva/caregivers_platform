<h1>Caregiver Registration</h1>
{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset>
        <legend>Account</legend>
        <label>Email:</label>
        <input type="email" name="email" required><br>
        <label>Password:</label>
        <input type="password" name="password" required><br>
    </fieldset>
    <fieldset>
        <legend>Profile</legend>
        <label>Given Name:</label>
        <input type="text" name="given_name" required><br>
        <label>Surname:</label>
        <input type="text" name="surname" required><br>
        <label>City:</label>
        <input type="text" name="city" required><br>
        <label>Phone number:</label>
        <input type="text" name="phone_number" required><br>
        <label>Gender:</label>
        <input type="text" name="gender"><br>
        <label>Biography:</label>
        <textarea name="biography"></textarea><br>
    </fieldset>
    <fieldset>
        <legend>Caregiving</legend>
        <label>Caregiving type:</label>
        <select name="caregiving_type" required>
            {% for value,label in care_types %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select><br>
        <label>Hourly rate:</label>
        <input type="number" step="0.01" name="hourly_rate" required><br>
        <label>Photo:</label>
        <input type="file" name="photo" accept="image/*"><br>
    </fieldset>
    <button type="submit">Register</button>
</form>
<a href="{% url 'caregiver_list' %}">Back to caregivers</a>
